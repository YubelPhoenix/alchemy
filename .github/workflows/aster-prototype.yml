name: Aster prototype source audit

on:
  push:
    branches: ['experiment/aster-convergence-town']
    paths:
      - 'tools/aster_layout.py'
      - 'tools/aster_prepare_messages.py'
      - 'tools/dark_story_rewrite.py'
      - 'tools/dark_story/*.tsv'
      - 'tools/aster_dialogue.tsv'
      - 'tools/check_aster.py'
      - 'tools/check_aster_ruin.py'
      - 'tools/aster_ruin_variant.py'
      - 'tools/aster_ruined_map.txt'
      - 'tools/ASTER_INTEGRATION.md'
      - 'games/tbs/src/map/map_180/**'
      - 'games/tbs/src/scene/aster.c'
      - 'games/tbs/src/scene/entry/aster.s'
      - 'games/tbs/src/scene/import/aster.s'
      - 'games/tbs/src/field/scenes.s'
      - 'games/tbs/src/field/maps.c'
      - 'games/tbs/src/system/resource/directory.s'
      - 'games/tbs/text/en.po'
      - 'games/tbs/objects.tsv'
      - '.github/workflows/aster-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: Map, scene, dialogue and resource contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check script syntax
        run: python3 -m py_compile tools/aster_layout.py tools/check_aster.py tools/aster_ruin_variant.py tools/check_aster_ruin.py tools/aster_prepare_messages.py
      - name: Check reproducible exported map
        run: python3 tools/aster_layout.py --check
      - name: Audit Aster map, linked text, scene, actors and flags
        run: python3 tools/check_aster.py
      - name: Audit unregistered ruined-map geometry and exact event parity
        run: |
          python3 tools/aster_ruin_variant.py --check
          python3 tools/check_aster_ruin.py
      - name: Generate authored Ashfall dialogue and check Aster ID safety
        run: |
          python3 tools/aster_prepare_messages.py
          python3 tools/dark_story_rewrite.py
          python3 tools/aster_prepare_messages.py --verify
      - name: Install native map-encoder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends pkg-config libpng-dev libutf8proc-dev
      - name: Encode normal and ruined grids with actual ags-graphics
        run: |
          make -f tools/Makefile tools/out/ags-graphics
          tools/out/ags-graphics games/tbs/src/map/map_180/map.txt "$RUNNER_TEMP/aster-map.grid.lz"
          tools/out/ags-graphics tools/aster_ruined_map.txt "$RUNNER_TEMP/aster-ruin.grid.lz"
          test -s "$RUNNER_TEMP/aster-map.grid.lz"
          test -s "$RUNNER_TEMP/aster-ruin.grid.lz"
          echo 'PASS: Both complete Aster grids accepted by the original map encoder.'

  # Full ROM build runs manually, or on a single specifically marked
  # experimental commit. Ordinary Aster changes run only the fast source audit.
  # No ROM is uploaded or redistributed.
  manual-rom-build:
    name: Aster modified-English ROM compilation smoke test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[aster-rom-smoke]'))
    needs: source-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install compiler dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential binutils-arm-none-eabi pkg-config \
            libpng-dev libutf8proc-dev ccache
      - name: Generate authored Ashfall messages without shifting Aster IDs
        run: |
          python3 tools/aster_prepare_messages.py
          python3 tools/dark_story_rewrite.py
          python3 tools/aster_prepare_messages.py --verify
      - name: Generate Ashfall custom battle and scene artwork
        run: |
          python3 -m pip install --break-system-packages Pillow numpy opencv-python-headless
          python3 tools/dark_story/build_heart_art.py
          python3 tools/dark_story/build_ash_jenna_art.py
          python3 tools/dark_story/build_kegare_art.py
          python3 tools/dark_story/build_sarah_art.py
          python3 tools/dark_story/build_sarah_overworld.py
      - name: Build pinned toolchain
        run: make bootstrap CARGO=false
      - name: Compile English prototype
        run: make -k -j"$(nproc)" tbs-en CARGO=false
      - name: Confirm build and record internal file size (do not distribute ROM)
        run: |
          test -s out/tbs-en/tbs-en.gba
          stat -c 'Compiled ROM present locally: %s bytes' out/tbs-en/tbs-en.gba
