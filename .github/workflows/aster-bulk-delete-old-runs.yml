name: One-time hard-cap Actions run cleanup

# Single requested final pass, with a maximum of ten retained run histories.
# No game files, branches, IPS artifacts, or builds are touched.
on:
  push:
    branches:
      - experiment/aster-v14-native-map-staging
    paths:
      - .github/workflows/aster-bulk-delete-old-runs.yml

permissions:
  contents: read
  actions: write

# Distinct group: do not replace an already-pending earlier cleanup run.
concurrency:
  group: one-time-ashfall-final-run-history-cleanup
  cancel-in-progress: false

jobs:
  cap-history-to-ten:
    if: >-
      github.repository == 'YubelPhoenix/alchemy' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/experiment/aster-v14-native-map-staging' &&
      github.event.head_commit.message == 'maintenance: cap Actions run history to ten'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait for previous deletion job, keep essential runs, delete the rest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          me = int(os.environ["GITHUB_RUN_ID"])
          if repo != "YubelPhoenix/alchemy":
              raise SystemExit("SAFETY STOP: unexpected repository")
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Ashfall-ten-run-hard-cap",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=40) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          previous = 42532093405
          for i in range(150):
              job = api(f"/actions/runs/{previous}")
              if job["status"] == "completed":
                  if job["conclusion"] != "success":
                      raise SystemExit("SAFETY STOP: prior cleanup did not succeed.")
                  print("Earlier run cleanup succeeded.", flush=True)
                  break
              if i % 6 == 0:
                  print(f"Waiting for previously queued cleanup: {job['status']}", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("SAFETY STOP: prior cleanup did not finish.")

          def inventory():
              runs = []
              page = 1
              while True:
                  batch = api(f"/actions/runs?per_page=100&page={page}")["workflow_runs"]
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise RuntimeError("SAFETY STOP: unexpected run history size")
              return runs

          # The current working IPS, one backup, latest Aster preview, earlier
          # Aster compile, and both cleanup receipts remain accessible.
          keep = {
              42510772750,  # latest playable Ashfall IPS
              42508384926,  # working Ashfall backup IPS
              42458272143,  # most recent Aster review artifact
              42439316908,  # Aster ROM compilation evidence
              42530345779,  # 4 GB artifact cleanup receipt
              42532093405,  # preceding bulk run cleanup receipt
              me,           # never delete this job while it is running
          }
          runs = inventory()
          observed = {r["id"] for r in runs}
          required = {42510772750, 42508384926, 42458272143, me}
          if not required.issubset(observed):
              raise RuntimeError(f"SAFETY STOP: protected run missing: {required-observed}")

          for r in runs:
              if r["status"] != "completed":
                  keep.add(r["id"])
          if len(keep) > 10:
              raise RuntimeError(f"SAFETY STOP: {len(keep)} active/protected runs, cannot keep <=10")

          to_remove = sorted(
              [r for r in runs if r["id"] not in keep and r["status"] == "completed"],
              key=lambda r: (r["created_at"], r["id"]),
          )
          print(f"Found {len(runs)} histories, protecting {len(keep)}, deleting {len(to_remove)}.", flush=True)
          removed = 0
          for run in to_remove:
              try:
                  api(f"/actions/runs/{run['id']}", "DELETE")
              except urllib.error.HTTPError as error:
                  print(f"SAFETY STOP: HTTP {error.code} deleting run {run['id']}", flush=True)
                  raise
              removed += 1
              if removed % 25 == 0:
                  print(f"Deleted {removed}/{len(to_remove)} histories", flush=True)
              time.sleep(0.65)

          final = inventory()
          print(f"FINAL: deleted={removed}, remaining={len(final)}", flush=True)
          print(f"Protected runs: {sorted(keep)}", flush=True)
          if len(final) > 10:
              raise RuntimeError("SAFETY STOP: >10 workflow runs remain after final cleanup")
          if any(r["id"] not in {x["id"] for x in final} for r in runs if r["id"] in required):
              raise RuntimeError("SAFETY STOP: one of the essential protected runs is missing")
          print("PASS: at most ten runs, working IPS histories retained.", flush=True)
          PY
