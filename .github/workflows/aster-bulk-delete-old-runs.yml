name: One-time old GitHub Actions run history cleanup

# Source game files and artifacts are never edited by this workflow.
# Only this exact one-time commit message on the Aster staging branch triggers it.
on:
  push:
    branches:
      - experiment/aster-v14-native-map-staging
    paths:
      - .github/workflows/aster-bulk-delete-old-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-time-ashfall-run-history-cleanup
  cancel-in-progress: false

jobs:
  prune-obsolete-workflow-runs:
    if: >-
      github.repository == 'YubelPhoenix/alchemy' &&
      github.ref == 'refs/heads/experiment/aster-v14-native-map-staging' &&
      github.event.head_commit.message == 'maintenance: bulk-delete obsolete Actions run history'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Wait for prior artifact cleanup, then delete old completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          current_id = int(os.environ["GITHUB_RUN_ID"])
          if repo != "YubelPhoenix/alchemy":
              raise SystemExit("Safety stop: incorrect repository")
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Aster-one-time-workflow-run-cleanup",
          }

          def api(path, method="GET"):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=35) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None

          # First cleanup removes stored artifacts. Never remove their run
          # histories while deletion is in progress.
          cleanup_id = 42530345779
          for attempt in range(80):
              cleanup = api(f"/actions/runs/{cleanup_id}")
              status = cleanup["status"]
              if status == "completed":
                  if cleanup["conclusion"] != "success":
                      raise SystemExit("Artifact cleanup failed: refusing run deletion")
                  print("Earlier artifact cleanup confirmed successful.", flush=True)
                  break
              print(f"Artifact cleanup status: {status}; waiting", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Prior cleanup did not finish within safe window")

          runs = []
          page = 1
          while True:
              batch = api(f"/actions/runs?per_page=100&page={page}")["workflow_runs"]
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 100:
                  raise SystemExit("Safety stop: excessive run count")
          runs.sort(key=lambda r: (r["created_at"], r["id"]), reverse=True)

          # Explicit preservation of working Ashfall IPS, backup, Aster
          # reference preview and last successful Aster compile.
          keep = {42510772750, 42508384926, 42505034836,
                  42458272143, 42439316908, 42530345779, current_id}
          # Keep the 12 most recent workflow records for troubleshooting.
          keep.update(r["id"] for r in runs[:12])
          # Preserve the most recent successful record of each workflow type.
          protected_workflows = set()
          for r in runs:
              if r["conclusion"] == "success" and r["name"] not in protected_workflows:
                  keep.add(r["id"])
                  protected_workflows.add(r["name"])

          candidates = [
              r for r in runs if r["id"] not in keep and r["status"] == "completed"
          ]
          candidates.sort(key=lambda r: (r["created_at"], r["id"]))
          # GitHub Actions token API rate limits apply per repository.
          # Delete at most 700 during this single maintenance invocation;
          # further deletions require a separate deliberate action.
          selected = candidates[:700]

          print(f"Discovered {len(runs)} workflow runs.", flush=True)
          print(f"Protected {len(keep)} important/recent workflow runs.", flush=True)
          print(f"Eligible old completed runs: {len(candidates)}.", flush=True)
          print(f"Selected for this one-time pass: {len(selected)}.", flush=True)
          print("No source files, branches, working ROMs or new artifacts will be modified.", flush=True)
          count = 0
          for run in selected:
              try:
                  api(f"/actions/runs/{run['id']}", "DELETE")
              except urllib.error.HTTPError as ex:
                  print(f"STOP: delete run {run['id']} returned HTTP {ex.code}; completed {count} deletions.", flush=True)
                  raise
              count += 1
              if count % 40 == 0:
                  print(f"Deleted {count}/{len(selected)} old completed runs", flush=True)
              time.sleep(0.9)

          print(f"FINISHED deleted {count} old workflow runs.", flush=True)
          print("Protected run IDs:", sorted(keep), flush=True)
          PY
