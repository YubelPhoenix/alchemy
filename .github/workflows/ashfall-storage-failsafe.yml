name: Ashfall free-tier artifact storage fail-safe

# Scheduled workflows run from the repository's default branch only.
# This maintenance job does NOT compile a ROM or upload any artifacts.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ashfall-free-tier-artifact-maintenance
  cancel-in-progress: false

jobs:
  keep-artifacts-under-free-tier-limit:
    # Standard GitHub runners are only free for public repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retain latest Ashfall IPS and Aster reference, purge redundant artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "YubelPhoenix/alchemy":
              raise SystemExit("SAFETY STOP: incorrect repository")
          root = f"https://api.github.com/repos/{repo}/actions/artifacts"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Ashfall-free-tier-storage-failsafe",
          }

          def api(url, method="GET"):
              request = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          def inventory():
              items = []
              page = 1
              while True:
                  block = api(f"{root}?per_page=100&page={page}")["artifacts"]
                  items.extend(a for a in block if not a.get("expired"))
                  if len(block) < 100:
                      return items
                  page += 1
                  if page > 100:
                      raise RuntimeError("SAFETY STOP: artifact inventory too large")

          items = inventory()
          items.sort(key=lambda a: (a["created_at"], a["id"]), reverse=True)
          now = dt.datetime.now(dt.timezone.utc)
          recent_since = now - dt.timedelta(hours=2)

          def is_ips(a):
              n = a["name"].lower()
              return ("ashfall" in n and ("ips" in n or "golden-sun" in n)
                      or "dark-vale-ips" in n or n.startswith("golden-sun-tbs-en-dialogue"))
          def is_aster(a):
              n = a["name"].lower()
              return "aster" in n and not is_ips(a)
          def is_report(a):
              return a["name"].lower().startswith("memory-report-")

          patches = [a for a in items if is_ips(a)]
          aster = [a for a in items if is_aster(a)]
          reports = [a for a in items if is_report(a)]
          protected = set()
          protected.update(a["id"] for a in patches[:2])
          protected.update(a["id"] for a in aster[:1])
          protected.update(a["id"] for a in reports[:1])
          # Do not race uploads from a concurrent build or new release.
          for a in items:
              stamp = dt.datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))
              if stamp >= recent_since:
                  protected.add(a["id"])

          size_before = sum(int(a["size_in_bytes"]) for a in items)
          print(f"Starting: {len(items)} live artifacts, {size_before/1_000_000:.2f} MB", flush=True)
          print(f"Protected artifact IDs: {sorted(protected)}", flush=True)
          obsolete = [a for a in items if a["id"] not in protected]
          obsolete.sort(key=lambda a: (-int(a["size_in_bytes"]), a["created_at"]))
          deleted_bytes = 0
          for index, a in enumerate(obsolete, 1):
              try:
                  api(f"{root}/{a['id']}", "DELETE")
              except urllib.error.HTTPError as err:
                  print(f"SAFETY STOP: deletion HTTP {err.code}, artifact {a['id']}", flush=True)
                  raise
              deleted_bytes += int(a["size_in_bytes"])
              if index % 20 == 0:
                  print(f"Removed {index}/{len(obsolete)} obsolete artifacts", flush=True)
              time.sleep(0.45)

          remaining = inventory()
          remaining_bytes = sum(int(a["size_in_bytes"]) for a in remaining)
          print(f"Freed approx {deleted_bytes/1_000_000:.2f} MB", flush=True)
          print(f"VERIFIED: {len(remaining)} artifacts, {remaining_bytes/1_000_000:.2f} MB", flush=True)
          if remaining_bytes >= 150_000_000:
              raise SystemExit("SAFETY STOP: repo remains >=150 MB; pre-build gate will block.")
          print("PASS: repository artifacts below conservative 150 MB threshold.", flush=True)
          print("This only checks THIS repository's Actions artifacts, not account Packages or other repos.", flush=True)
          PY

      - name: Limit repository workflow history to ten runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          current_id = int(os.environ["GITHUB_RUN_ID"])
          if repo != "YubelPhoenix/alchemy":
              raise SystemExit("SAFETY STOP: unexpected repository")
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Ashfall-daily-ten-run-cap",
          }
          def api(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as res:
                  raw = res.read()
                  return json.loads(raw) if raw else None

          def inventory(path, key):
              all_items = []
              page = 1
              while True:
                  items = api(f"{path}?per_page=100&page={page}")[key]
                  all_items.extend(items)
                  if len(items) < 100:
                      break
                  page += 1
                  if page > 100:
                      raise SystemExit("SAFETY STOP: unexpected pagination")
              return all_items

          runs = inventory("/actions/runs", "workflow_runs")
          runs.sort(key=lambda r: (r["created_at"], r["id"]), reverse=True)
          artifacts = inventory("/actions/artifacts", "artifacts")
          # Preserve workflow records for all still-downloadable IPS and
          # Aster review artifacts. No build source or IPS bytes are deleted.
          keep = {current_id}
          keep.update(
              a["workflow_run"]["id"]
              for a in artifacts
              if not a.get("expired") and a.get("workflow_run")
          )
          # Preserve historical source/build receipts if there is room.
          important = [42510772750, 42508384926, 42458272143, 42439316908]
          ids = {r["id"] for r in runs}
          for rid in important:
              if rid in ids and len(keep) < 10:
                  keep.add(rid)
          for r in runs:
              if r["status"] != "completed":
                  keep.add(r["id"])
          if len(keep) > 10:
              raise SystemExit(f"SAFETY STOP: {len(keep)} necessary/active run records exceed cap")
          for r in runs:
              if len(keep) >= 10:
                  break
              keep.add(r["id"])

          obsolete = [r for r in runs if r["id"] not in keep and r["status"] == "completed"]
          print(f"Run history cleanup: found={len(runs)}, protecting={len(keep)}, removing={len(obsolete)}", flush=True)
          for idx, r in enumerate(obsolete, 1):
              api(f"/actions/runs/{r['id']}", "DELETE")
              if idx % 20 == 0:
                  print(f"Deleted {idx}/{len(obsolete)} old runs", flush=True)
              time.sleep(0.45)
          verified = inventory("/actions/runs", "workflow_runs")
          print(f"Run history after cleanup: {len(verified)}", flush=True)
          if len(verified) > 10:
              raise SystemExit("SAFETY STOP: more than ten runs remain")
          print("PASS: 10 or fewer retained runs", flush=True)
          PY
