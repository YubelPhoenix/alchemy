name: Validate Golden Sun dialogue build

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/tbs/text/en.po'
      - 'games/tbs/src/scene/vale_stormy_night.c'
      - '.github/workflows/build-golden-sun-dialogue.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source and pinned compiler submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl patch binutils-arm-none-eabi \
            pkg-config libpng-dev libutf8proc-dev

      - name: Build pinned toolchain and host tools
        run: make bootstrap CARGO=false

      - name: Compile the modified English edition
        run: make -j"$(nproc)" tbs-en CARGO=false

      - name: Confirm the ROM was built without publishing it
        run: test -s out/tbs-en/tbs-en.gba
