name: Build Golden Sun TBS English dialogue experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/tbs/text/en.po'
      - 'games/tbs/src/scene/vale_stormy_night.c'
      - '.github/workflows/build-golden-sun-dialogue.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source and pinned compiler submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl patch binutils-arm-none-eabi \
            pkg-config libpng-dev libutf8proc-dev

      - name: Apply the experimental Vale prologue dialogue rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('games/tbs/text/en.po')
          text = path.read_text(encoding='utf-8')

          replacements = {}

          entries = re.split(r'(\n\s*\n)', text)
          found = set()
          for i, entry in enumerate(entries):
              match = re.search(r'^msgid "([0-9]{5})"$', entry, re.MULTILINE)
              if not match or match.group(1) not in replacements:
                  continue
              msgid = match.group(1)
              if msgid in found:
                  raise SystemExit(f'Duplicate dialogue ID {msgid}.')
              found.add(msgid)
              # Replace the whole msgstr field, not just its first line. The
              # previous approach left old continuation lines attached, which
              # could render as jumbled text in-game.
              entry_lines = entry.splitlines()
              msgstr_index = next((j for j, line in enumerate(entry_lines) if line.startswith('msgstr ')), None)
              if msgstr_index is None:
                  raise SystemExit(f'Missing msgstr for {msgid}.')
              entry_lines = entry_lines[:msgstr_index] + ['msgstr "' + replacements[msgid] + '"']
              entries[i] = '\n'.join(entry_lines)

          missing = sorted(set(replacements) - found)
          if missing:
              raise SystemExit(f'Missing expected dialogue IDs: {", ".join(missing)}')

          updated = ''.join(entries)
          path.write_text(updated, encoding='utf-8')
          print(f'Updated {len(found)} dialogue entries across the storm prologue, Vale villagers, Garet, and Saturos/Menardi.')
          PY

      - name: Build pinned toolchain and host tools
        run: make bootstrap

      - name: Build English edition
        run: make tbs-en

      - name: Upload test ROM
        uses: actions/upload-artifact@v4
        with:
          name: golden-sun-tbs-en-dialogue-test
          path: out/tbs-en/tbs-en.gba
          if-no-files-found: error
          retention-days: 3
