name: One-time obsolete Ashfall artifact cleanup

# Only a change to THIS file on the isolated Aster branch can run this job.
# No ROM compilation, no package install, no artifact uploads.
on:
  push:
    branches:
      - experiment/aster-v14-native-map-staging
    paths:
      - .github/workflows/aster-one-time-artifact-cleanup.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-ashfall-artifact-cleanup
  cancel-in-progress: false

jobs:
  delete-obsolete-artifacts:
    if: github.repository == 'YubelPhoenix/alchemy' && github.ref == 'refs/heads/experiment/aster-v14-native-map-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove redundant old build outputs, preserve latest playable IPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "YubelPhoenix/alchemy", "Unexpected repository"
          assert os.environ["GITHUB_REF"] == "refs/heads/experiment/aster-v14-native-map-staging"
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repo}/actions/artifacts"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Aster-one-time-storage-cleanup",
          }

          def api(url, method="GET"):
              request = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          artifacts = []
          page = 1
          while True:
              batch = api(f"{root}?per_page=100&page={page}")
              subset = batch.get("artifacts", [])
              artifacts.extend(subset)
              if len(subset) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError("Safety stop: unexpected >10,000 artifacts")

          active = [a for a in artifacts if not a.get("expired")]
          def is_ips(a):
              n = a["name"].lower()
              return n.startswith("ashfall-ips-") or n.startswith("golden-sun-ashfall-")
          def is_report(a):
              return a["name"].lower().startswith("memory-report-")
          def is_aster_preview(a):
              return a["name"].lower() in (
                  "aster-single-town-review", "aster-native-visual-review",
                  "aster-terrain-preview", "aster-prototype-preview")
          ips = sorted((a for a in active if is_ips(a)),
                       key=lambda a: (a["created_at"], a["id"]), reverse=True)
          reports = sorted((a for a in active if is_report(a)),
                           key=lambda a: (a["created_at"], a["id"]), reverse=True)
          previews = sorted((a for a in active if is_aster_preview(a)),
                            key=lambda a: (a["created_at"], a["id"]), reverse=True)

          # Explicitly retain the last known stable Ashfall IPS from 08a1c6e.
          protected = {13629267284}
          # Also keep the three newest IPS, latest memory report, latest
          # Aster preview and every artifact of any unrecognized type.
          protected.update(a["id"] for a in ips[:3])
          protected.update(a["id"] for a in reports[:1])
          protected.update(a["id"] for a in previews[:1])

          candidates = [a for a in (ips + reports + previews)
                        if a["id"] not in protected]
          candidates.sort(key=lambda a: (-a["size_in_bytes"],
                                         a["created_at"], a["id"]))

          print(f"Active artifacts: {len(active)}")
          print(f"Preserved IPS IDs: {[a['id'] for a in ips[:3]]}")
          print("Explicitly protected stable IPS ID: 13629267284")
          print(f"Eligible obsolete artifacts: {len(candidates)}")
          print("Deletion cap: 300 artifacts; no workflow runs or source files deleted")

          removed_bytes = 0
          success = failed = 0
          for a in candidates[:300]:
              try:
                  api(f"{root}/{a['id']}", "DELETE")
              except urllib.error.HTTPError as err:
                  print(f"FAIL delete artifact {a['id']} {a['name']}: HTTP {err.code}")
                  failed += 1
                  if err.code in (401, 403, 429):
                      raise RuntimeError("Deletion permission/rate-limit failure; stopping")
              else:
                  success += 1
                  removed_bytes += int(a["size_in_bytes"])
                  if success % 20 == 0:
                      print(f"Deleted {success} artifacts; approx {removed_bytes/1_000_000:.1f} MB")
              time.sleep(0.55)

          print(f"DONE deleted={success} failed={failed} storage_freed_estimate_MB={removed_bytes/1_000_000:.1f}")
          print("No builds were run; no artifacts uploaded. Account billing may update later.")
          PY
