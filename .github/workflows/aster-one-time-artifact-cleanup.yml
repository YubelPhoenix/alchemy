name: One-time obsolete Ashfall artifact cleanup

# Only a change to THIS file on the isolated Aster branch can run this job.
# No ROM compilation, no package install, no artifact uploads.
on:
  push:
    branches:
      - experiment/aster-v14-native-map-staging
    paths:
      - .github/workflows/aster-one-time-artifact-cleanup.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-ashfall-artifact-cleanup
  cancel-in-progress: false

jobs:
  delete-obsolete-artifacts:
    if: github.repository == 'YubelPhoenix/alchemy' && github.ref == 'refs/heads/experiment/aster-v14-native-map-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Remove ALL obsolete build outputs, preserve two working IPS patches and latest Aster preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "YubelPhoenix/alchemy", "Unexpected repository"
          assert os.environ["GITHUB_REF"] == "refs/heads/experiment/aster-v14-native-map-staging"
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repo}/actions/artifacts"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Aster-conservative-final-artifact-cleanup",
          }

          def api(url, method="GET"):
              request = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          artifacts = []
          page = 1
          while True:
              batch = api(f"{root}?per_page=100&page={page}")
              subset = batch.get("artifacts", [])
              artifacts.extend(subset)
              if len(subset) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError("Safety stop: unexpected >10,000 artifacts")

          active = [a for a in artifacts if not a.get("expired")]
          if not active:
              print("No active artifacts; nothing to delete.")
              raise SystemExit(0)
          by_id = {a["id"]: a for a in active}
          def is_current_ips(a):
              name = a["name"].lower()
              return name.startswith("ashfall-ips-") or name.startswith("golden-sun-ashfall-")
          def is_aster_preview(a):
              return a["name"].lower() == "aster-single-town-review"

          ips = sorted((a for a in active if is_current_ips(a)),
                       key=lambda a: (a["created_at"], a["id"]), reverse=True)
          previews = sorted((a for a in active if is_aster_preview(a)),
                            key=lambda a: (a["created_at"], a["id"]), reverse=True)

          # Never delete the latest confirmed Ashfall patch, one recent backup,
          # or the latest useful Aster exterior preview. Keep any newer
          # Ashfall IPS too if a build raced with this one-time cleanup.
          protected = {13629267284, 13628277204, 13608746230}
          protected.update(a["id"] for a in ips[:2])
          protected.update(a["id"] for a in previews[:1])

          required = {13629267284, 13628277204, 13608746230}
          if not required.issubset(by_id):
              raise RuntimeError("Critical IPS/preview protection missing; refusing cleanup")

          candidates = [a for a in active if a["id"] not in protected]
          candidates.sort(key=lambda a: (-int(a["size_in_bytes"]),
                                         a["created_at"], a["id"]))
          active_size = sum(int(a["size_in_bytes"]) for a in active)
          retained = [a for a in active if a["id"] in protected]
          keep_size = sum(int(a["size_in_bytes"]) for a in retained)
          print(f"Active artifacts before cleanup: {len(active)} / {active_size/1_000_000:.1f} MB")
          print(f"Explicitly protected IPS/preview IDs: {sorted(protected)}")
          print(f"Expected remaining storage: {len(retained)} artifacts / {keep_size/1_000_000:.2f} MB")
          print(f"Eligible obsolete artifacts: {len(candidates)}")
          print("Only GitHub Actions artifacts will be deleted. No source files, branches or workflow runs.")
          if keep_size > 100_000_000:
              raise RuntimeError("Preserved artifacts exceed 100 MB; refusing unsafe assumptions")

          removed_bytes = 0
          success = failed = 0
          for a in candidates:
              try:
                  api(f"{root}/{a['id']}", "DELETE")
              except urllib.error.HTTPError as err:
                  print(f"FAIL delete artifact {a['id']} {a['name']}: HTTP {err.code}")
                  failed += 1
                  if err.code in (401, 403, 429):
                      raise RuntimeError("Deletion permission/rate-limit failure; stopping")
              else:
                  success += 1
                  removed_bytes += int(a["size_in_bytes"])
                  if success % 40 == 0:
                      print(f"Deleted {success} artifacts; approx {removed_bytes/1_000_000:.1f} MB")
              time.sleep(0.65)

          print(f"DONE deleted={success} failed={failed} storage_freed_estimate_MB={removed_bytes/1_000_000:.1f}")
          if failed:
              raise RuntimeError(f"Cleanup incomplete: {failed} deletions failed")
          remaining = []
          page = 1
          while True:
              batch = api(f"{root}?per_page=100&page={page}")
              subset = batch.get("artifacts", [])
              remaining.extend(a for a in subset if not a.get("expired"))
              if len(subset) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError("Safety stop: too many artifacts in post-check")
          remain_size = sum(int(a["size_in_bytes"]) for a in remaining)
          print(f"VERIFIED remaining={len(remaining)} active_artifacts bytes={remain_size} MB={remain_size/1_000_000:.2f}")
          if remain_size > 300_000_000:
              raise RuntimeError("Remaining artifact storage above 300 MB safety threshold")
          print("No builds were run; no artifacts uploaded. Account billing may update later.")
          PY
