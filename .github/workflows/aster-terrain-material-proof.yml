name: Aster native terrain material proof

on:
  push:
    branches: ['experiment/aster-concept-blueprint-v1']
    paths:
      - 'tools/aster_native_terrain_proof.py'
      - '.github/workflows/aster-terrain-material-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aster-terrain-material-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: true
      - name: Install source-only renderer
        run: python3 -m pip install --break-system-packages -q Pillow
      - name: Render native Vale terrains with original palette/metatiles
        run: python3 tools/aster_native_terrain_proof.py
      - name: Archive exact Golden Sun terrain tile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aster-actual-native-terrain-proof
          path: |
            tools/aster_native_terrain_proof.png
            tools/aster_native_terrain_proof.json
          retention-days: 14
      - name: Commit reviewed source material reference to blueprint branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/aster_native_terrain_proof.png tools/aster_native_terrain_proof.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aster: publish exact native terrain materials [skip ci]'
            git pull --rebase origin experiment/aster-concept-blueprint-v1
            git push origin HEAD:experiment/aster-concept-blueprint-v1
          fi
