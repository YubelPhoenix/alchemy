name: Validate Heart battle artwork

on:
  workflow_dispatch:
  push:
    branches: [dark-story-rewrite]
    paths:
      - 'tools/dark_story/build_heart_art.py'
      - 'tools/dark_story/build_ash_jenna_art.py'
      - 'tools/dark_story/build_ash_jenna_overworld.py'
      - 'assets/ash_jenna/**'
      - 'assets/heart/**'
      - '.github/workflows/build-heart-art.yml'

permissions:
  contents: read

jobs:
  validate-heart-art:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Heart sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages Pillow numpy
      - name: Generate Heart artwork independently of dialogue
        run: python3 tools/dark_story/build_heart_art.py
      - name: Generate Ash Jenna artwork and check her sheet
        run: |
          python3 tools/dark_story/build_ash_jenna_art.py
          python3 tools/dark_story/build_ash_jenna_overworld.py
          python3 - <<'PY'
          from PIL import Image
          sheet = Image.open('games/tbs/src/graphics/monster/slime.png')
          assert sheet.mode == 'P' and sheet.size == (64, 1024), (sheet.mode, sheet.size)
          shared = Image.open('games/tbs/src/system/memory/basic.png').getpalette()[:224 * 3]
          assert sheet.getpalette()[:224 * 3] == shared
          used = set(sheet.getdata())
          assert max(used) <= 223 and max(used) > 15, used
          print('Ash Jenna artwork validated')
          PY
      - name: Check sprite palette and frame dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          sprite = Image.open('games/tbs/src/graphics/monster/purple_beast.png')
          assert sprite.mode == 'P', sprite.mode
          assert sprite.size == (64, 768), sprite.size
          used = set(sprite.getdata())
          # Battle monsters are 8bpp raw indices into the shared sprite
          # palette, so the sheet must carry exactly that palette.
          shared = Image.open('games/tbs/src/system/memory/basic.png').getpalette()[:224 * 3]
          palette = sprite.getpalette()
          assert palette[:224 * 3] == shared, 'palette differs from basic.png'
          assert min(used) == 0 and max(used) <= 223, used
          assert max(used) > 15, 'sheet only uses 16 colours'
          assert all(c % 8 == 0 for c in palette[:224 * 3])
          for idx in range(6):
              top = sprite.crop((0, idx * 128, 64, idx * 128 + 64))
              bottom = sprite.crop((0, idx * 128 + 64, 64, (idx + 1) * 128))
              assert top.tobytes() == bottom.tobytes(), idx
          print(f'Heart artwork validated: {sprite.size}, {len(used)} indexed colors')
          PY
      - name: Upload Heart artwork preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heart-artwork-preview
          path: |
            games/tbs/src/graphics/monster/purple_beast.png
            games/tbs/src/graphics/ui/icons/icon_66.png
          retention-days: 14
